# Cache kafli Geoportalu — Cloudflare Worker + R2.
# Wdrożenie z katalogu głównego: npm run kafle:login, kafle:bucket, kafle:deploy.
# Adres Workera wpisz do config.json → basemaps.kafleUrl.
name = "pzw-kafle"
main = "worker.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "KAFLE"
bucket_name = "pzw-kafle"

[vars]
GEOPORTAL = "https://mapy.geoportal.gov.pl"
# Źródła, którym Worker odpowiada (Origin/Referer); puste = każdemu.
ALLOWED_ORIGINS = "https://pzw-rzeszow.github.io,https://mapa.rzeszow.pzw.pl"
TTL_SEC = "2592000"

[observability]
enabled = true
