# Kontrola przy każdym pushu i pull requeście: składnia skryptów, walidacja
# snapshotu danych i build produkcyjny. Job nie ma sekretów ani uprawnień zapisu,
# więc może bezpiecznie uruchamiać kod z pull requestów z forków.

name: Kontrola kodu i danych

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Składnia skryptów i walidacja snapshotu
        run: npm run check
      - name: Build (Vite)
        run: npm run build
