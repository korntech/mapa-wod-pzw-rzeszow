# Kontrola przy każdym pushu i pull requeście: składnia skryptów, walidacja
# snapshotu danych i build produkcyjny.

name: Kontrola kodu i danych

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Składnia skryptów i walidacja snapshotu
        run: npm run check
      - name: Build (Vite)
        run: npm run build
