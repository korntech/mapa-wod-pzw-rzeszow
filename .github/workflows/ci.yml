# Kontrola przy każdym pushu i pull requeście: składnia skryptów, walidacja
# snapshotu danych i build produkcyjny.

name: Kontrola kodu i danych

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Składnia skryptów i walidacja snapshotu
        run: npm run check
      - name: Build (Vite)
        run: npm run build
