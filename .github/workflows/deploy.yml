# Publikacja builda (dist/) na GitHub Pages po każdym pushu do main oraz po zakończeniu
# nocnego snapshotu (commit wykonany tokenem GITHUB_TOKEN nie wyzwala zdarzenia push,
# więc bez wyzwalacza workflow_run snapshot na stronie nigdy by się nie odświeżył).
# Wymaga ustawienia w repozytorium: Settings → Pages → Source: "GitHub Actions".
#
# Publikowany jest DOKŁADNIE ten commit, który przeszedł kontrolę w tym samym przebiegu
# (job `check` → `build` → `deploy`), a nie „aktualny main”. Nieudane testy lub walidacja
# danych blokują publikację. Uprawnienia pages/id-token ma tylko job wdrożenia.

name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Snapshot danych z bazy']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Dla workflow_run zdarzenie niesie SHA commitu snapshotu; dla push/dispatch — github.sha.
  PUBLIKOWANY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLIKOWANY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Składnia, walidacja snapshotu i testy
        run: npm run check

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLIKOWANY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
