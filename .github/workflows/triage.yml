# Wstępna klasyfikacja zgłoszeń z formularza mapy (issue z etykietą „zgłoszenie”):
# model językowy przez Copilot CLI ocenia kategorię i pewność, a skrypt nadaje etykiety
# i komentarz z podpowiedzią dla operatora. Model nie zmienia danych ani kodu.
# Wymaga sekretu COPILOT_PAT: fine-grained PAT konta z Copilotem, uprawnienie „Copilot Requests”.
#
# WYŁĄCZONE AUTOMATYCZNIE (decyzja 24.09.2026): na etapie rozruchu zgłoszenia klasyfikuje
# operator ręcznie, więc anonimowa treść z formularza nie uruchamia modelu ani nie zużywa
# limitu Copilota. Klasyfikację można uruchomić ręcznie dla wybranego issue (Run workflow).
# Aby przywrócić tryb automatyczny, odkomentuj wyzwalacz `issues` poniżej.

name: Triage zgłoszeń

on:
  # issues:
  #   types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Numer issue do ponownej klasyfikacji
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'zgłoszenie')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Pobierz issue i zbuduj prompt
        id: prompt
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}" > issue.json
          node tools/triage/prompt.mjs issue.json triage
          echo "model=$(jq -r .model tools/triage/config.json)" >> "$GITHUB_OUTPUT"

      # Budżet dobowy chroni limit Copilota przed zalewem zgłoszeń: powyżej progu z config.json
      # issue zostaje bez klasyfikacji (operator widzi je i tak po etykiecie „zgłoszenie”).
      - name: Budżet dobowy
        id: budzet
        run: |
          LIMIT=$(jq -r .budzetDobowy tools/triage/config.json)
          ETYKIETA=$(jq -r .etykietaZgloszenia tools/triage/config.json)
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Liczone są wykonane wywołania modelu (issue, które dostały etykietę „pewność: …”
          # w ostatniej dobie), a nie sama liczba nowych zgłoszeń.
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ETYKIETA" --state all \
                --search "updated:>=$SINCE label:\"pewność: wysoka\",\"pewność: średnia\",\"pewność: niska\"" \
                --limit 500 --json number --jq 'length')
          echo "Klasyfikacji modelu w ostatniej dobie: $N (budżet: $LIMIT)"
          if [ "$N" -gt "$LIMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Budżet dobowy klasyfikacji wyczerpany — issue #$ISSUE pozostaje bez oceny modelu."
          fi

      # Wersja przypięta (podbijana świadomie, jak akcje): globalny CLI nie jest objęty lockfile ani npm audit.
      - name: Zainstaluj Copilot CLI
        if: steps.budzet.outputs.skip != 'true'
        run: npm install -g @github/copilot@1.0.88

      - name: Klasyfikacja
        if: steps.budzet.outputs.skip != 'true'
        id: model
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: triage/prompt.txt
          system-prompt-file: triage/system.txt
          model: ${{ steps.prompt.outputs.model }}

      - name: Etykiety i komentarz
        if: steps.budzet.outputs.skip != 'true'
        run: node tools/triage/apply.mjs "${{ steps.model.outputs.response-file }}" "$ISSUE"
