# Kontrola dostępności strony i bazy co 6 godzin. Przy awarii zakłada issue
# z etykietą „awaria” (albo dopisuje komentarz do otwartego); gdy kontrola
# przechodzi, otwarte issue jest zamykane.

name: Healthcheck strony i bazy

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sprawdź stronę i bazę
        id: probe
        shell: bash
        run: |
          SITE="$(jq -r .site.url config.json)$(jq -r .snapshot.file config.json)"
          DB_URL="$(jq -r .supabase.url config.json)"
          DB_KEY="$(jq -r .supabase.anonKey config.json)"
          TABLE="$(jq -r .supabase.tables.zbiorniki config.json)"

          site=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$SITE" || echo 0)
          db=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
                 "$DB_URL/rest/v1/$TABLE?select=id&limit=1" \
                 -H "apikey: $DB_KEY" -H "Authorization: Bearer $DB_KEY" || echo 0)
          echo "strona: $site, baza: $db"

          report=""
          [ "$site" = "200" ] || report="$report- Strona (GitHub Pages): HTTP $site"$'\n'
          [ "$db" = "200" ]   || report="$report- Baza: HTTP $db (5xx lub 0 może oznaczać zapauzowany projekt — wznów go w panelu bazy)"$'\n'

          {
            echo "failed=$([ -n "$report" ] && echo true || echo false)"
            echo "report<<EOF"
            printf '%s' "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Załóż lub uzupełnij issue o awarii
        if: steps.probe.outputs.failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const report = process.env.REPORT;
            const when = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: open } = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: 'awaria', per_page: 1 });
            if (open.length) {
              await github.rest.issues.createComment({ ...repo, issue_number: open[0].number, body: `Nadal nie działa (${when}):\n${report}` });
            } else {
              await github.rest.issues.create({
                ...repo,
                title: `Awaria: strona lub baza nie odpowiada (${when})`,
                body: `Healthcheck z ${when} wykrył problem:\n${report}\nMapa publiczna działa ze snapshotu niezależnie od bazy. Issue zamknie się samo, gdy kontrola przejdzie.`,
                labels: ['awaria'],
              });
            }

      - name: Zamknij issue, gdy wszystko działa
        if: steps.probe.outputs.failed == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: open } = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: 'awaria', per_page: 5 });
            for (const issue of open) {
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: 'Kontrola przeszła — strona i baza odpowiadają. Zamykam.' });
              await github.rest.issues.update({ ...repo, issue_number: issue.number, state: 'closed' });
            }
