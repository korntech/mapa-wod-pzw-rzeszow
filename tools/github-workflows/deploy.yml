# Publikacja mapy na GitHub Pages z artefaktu builda (Vite).
#
# Wymaga jednorazowego ustawienia w repozytorium:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (zamiast "Deploy from a branch"). Bez tego workflow się uruchomi, ale strona
# nadal będzie serwowana ze starych plików z gałęzi.
#
# Uruchamia się po każdym pushu do main — także po nocnym commicie snapshotu
# danych, więc świeże dane trafiają na stronę same.

name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
